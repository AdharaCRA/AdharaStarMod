unit.crstar-twilight.name = 归暝
unit.crstar-twilight.description = 战略型海军单位，具有毁天灭地的能力。\n每损失1%生命值，攻击力提升3%，最多提升至250%
unit.crstar-twilight.details = 这是我。


unit.crstar-FlyingSupportT5.description = 向敌人发射EMP火箭炮和数枚激光弹。\n使用它的维修光束和再生护盾保护附近的己方单位。\n[sky]对于敌方某些单位有极强的破坏力。


